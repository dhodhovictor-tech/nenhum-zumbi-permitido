<style>
/* Layout: one cartoon "TV frame" holding a side-scrolling street; HUD chips float on top, menus slide over as paper cards. Deliberately single light cartoon theme. */
:root {
  --ink: #2b1d2e;
  --paper: #fff4e0;
  --paper-2: #f6e4c3;
  --coin: #ffc23d;
  --coin-dark: #c98a00;
  --zombie: #7cbf4a;
  --blood: #e04f4f;
  --sky: #7ec8f2;
  --muted: #7a6470;
  --token: #4ac0c0;
  --night: #1d1838;
  --font-display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
  --font-body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
.wrap {
  height: 100%;
  box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.game {
  position: relative;
  height: 100%;
  border: 4px solid var(--ink);
  border-radius: 20px;
  overflow: hidden;
  background: var(--sky);
  box-shadow: 0 0 0 4px #463352;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

.hud { position: absolute; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; z-index: 3; }
.hud.top { top: 10px; }
.hud.events { top: 52px; justify-content: center; }
.hud.bottom { bottom: 10px; justify-content: space-between; }
.hud .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 3px 10px 3px 6px;
  font-weight: 700; font-size: 16px;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 0 var(--ink);
  font-family: var(--font-body);
  color: var(--ink);
}
.chip.clock { padding-left: 10px; }
.chip.clock.night { background: #3b2c5c; color: var(--paper); }
.chip.clock.blood { background: #7a1e2e; color: var(--paper); }
.chip.ev { font-size: 14px; padding: 2px 10px; }
.chip.ev.hot { background: #ffe08a; cursor: pointer; }
.chip.lvl { padding-left: 8px; }
.chip.lvl .xp { width: 42px; height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; }
.chip.lvl .xp i { display: block; height: 100%; background: var(--token); }
.ic { width: 20px; height: 20px; flex: none; }
.hbtn {
  pointer-events: auto;
  position: relative;
  font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em;
  color: var(--ink); background: var(--coin);
  border: 3px solid var(--ink); border-radius: 12px;
  padding: 6px 10px 4px;
  box-shadow: 0 3px 0 var(--ink);
  cursor: pointer;
}
.hbtn.alt { background: var(--paper); }
.hbtn.warn { background: var(--blood); color: var(--paper); animation: pulse 0.8s ease-in-out infinite alternate; }
.hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.badge {
  position: absolute; top: -9px; right: -8px;
  min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
  background: var(--blood); color: var(--paper);
  border: 2px solid var(--ink); border-radius: 10px;
  font-family: var(--font-body); font-weight: 700; font-size: 11px; line-height: 14px;
}
@keyframes pulse { to { transform: scale(1.08); } }
.weapon { min-width: 0; }
.weapon .bar { width: 46px; height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; }
.weapon .bar i { display: block; height: 100%; background: var(--zombie); }
body[data-mode="run"] .town-only { display: none !important; }
body:not([data-mode="run"]) .run-only { display: none !important; }

.toasts { position: absolute; top: 92px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 4; pointer-events: none; width: min(92%, 460px); }
.toast {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
  padding: 6px 12px; font-weight: 600; font-size: 15px; text-align: center;
  box-shadow: 0 3px 0 var(--ink);
  animation: tin 0.25s ease-out;
}
.toast.bad { background: #ffd9d4; }
.toast.good { background: #e3f6cf; }
.toast.event { background: #ffe08a; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

.sheet {
  position: absolute; inset: 0; z-index: 10;
  display: flex; overflow: auto;
  box-sizing: border-box;
  padding: 16px;
  background: rgba(43, 29, 46, 0.5);
}
.card {
  position: relative;
  margin: auto;
  width: 100%; max-width: 640px;
  box-sizing: border-box;
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 8px 0 var(--ink);
  padding: 20px clamp(14px, 4vw, 24px);
  display: flex; flex-direction: column; gap: 12px;
}
.card h1, .card h2, .card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; text-wrap: balance; line-height: 1.05; }
.card h1 { font-size: clamp(34px, 8vw, 56px); color: var(--coin); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink); text-align: center; }
.card h2 { font-size: 26px; padding-right: 40px; }
.card h3 { font-size: 18px; color: var(--muted); }
.card p { margin: 0; font-size: 16px; line-height: 1.4; max-width: 60ch; }
.card .lead { font-size: 18px; text-align: center; margin-inline: auto; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 16px; }
.lvl { font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--muted); }
.close {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px;
  font-family: var(--font-display); font-size: 20px; line-height: 1;
  background: var(--paper-2); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 50%;
  cursor: pointer;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.opt {
  min-width: 0;
  background: #fffaf0;
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.opt.on { background: #e3f6cf; }
.opt.locked { background: #efe6d6; color: var(--muted); }
.opt b { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: 0.02em; }
.opt p { font-size: 14px; line-height: 1.3; color: var(--muted); }
.dream { color: #2f8a5a; font-weight: 600; }
.swatch { display: flex; align-items: center; gap: 8px; }
.swatch i { width: 22px; height: 22px; border: 3px solid var(--ink); border-radius: 6px; flex: none; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-2); color: var(--ink); }
.btn {
  font-family: var(--font-display); font-size: 16px; letter-spacing: 0.03em;
  color: var(--ink); background: var(--coin);
  border: 3px solid var(--ink); border-radius: 12px;
  padding: 8px 12px 6px;
  box-shadow: 0 3px 0 var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: auto;
}
.btn.alt { background: var(--paper-2); }
.btn.green { background: var(--zombie); }
.btn.teal { background: var(--token); }
.btn.red { background: var(--blood); color: var(--paper); }
.btn:disabled { background: #e6dccb; color: #9c8f97; box-shadow: none; cursor: default; border-color: #b5a9ae; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .ic { width: 18px; height: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.list { display: grid; gap: 8px; }
.person {
  display: flex; align-items: center; gap: 10px;
  background: #fffaf0; border: 3px solid var(--ink); border-radius: 14px;
  padding: 8px 10px;
}
.person.done { background: #e3f6cf; }
.person .who { flex: 1; min-width: 0; }
.person .who b { display: block; font-size: 16px; }
.person .who span { font-size: 14px; color: var(--muted); }
.person .btn { margin-top: 0; font-size: 14px; padding: 6px 10px 4px; }
.face { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.prog { height: 14px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--zombie); }
.prog.small { height: 10px; }
.stat { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; font-weight: 600; }
.note { font-size: 14px !important; color: var(--muted); }
.log { display: grid; gap: 4px; font-size: 14px; color: var(--muted); margin: 0; padding-left: 18px; }
.btn:focus-visible, .hbtn:focus-visible, .close:focus-visible, .chip:focus-visible { outline: 3px solid #3f8ae0; outline-offset: 3px; }
/* HUD no estilo do original: barras laranja e azul-petróleo com borda vinho */
.hud.top .chip { background: linear-gradient(#ffc45a, #f08a24); border-color: #6a1f1f; color: #ffffff; text-shadow: 0 1.5px 0 #6a1f1f, 1px 0 0 #6a1f1f, -1px 0 0 #6a1f1f; box-shadow: 0 3px 0 #6a1f1f; }
.hud.top .chip.lvl, .hud.top .chip.clock { background: linear-gradient(#3fb8b4, #1f7f7c); }
.hud.top .chip.clock.night { background: linear-gradient(#4a3a7a, #2b2050); }
.hud.top .chip.clock.blood { background: linear-gradient(#a02a3a, #6a1020); }
.hbtn { background: linear-gradient(#3fb8b4, #1f7f7c); color: #ffd23f; border-color: #6a1f1f; box-shadow: 0 3px 0 #6a1f1f; text-shadow: 0 2px 0 #6a1f1f; }
.hbtn.alt { background: linear-gradient(#ffc45a, #f08a24); color: #ffffff; }
.hbtn.on { outline: 3px solid #ffd23f; outline-offset: 1px; }
#hWeapon { display: none; }
.alerts { position: absolute; left: 10px; top: 150px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.alert {
  position: relative; width: 46px; height: 46px; border-radius: 9px;
  background: linear-gradient(#3fb8b4, #1f7f7c); border: 3px solid #6a1f1f; box-shadow: 0 3px 0 #6a1f1f;
  color: #ffb030; font-family: var(--font-display); font-size: 28px; line-height: 1; cursor: pointer;
  text-shadow: 0 2px 0 #7a3a10;
}
.alert small { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-body); font-weight: 700; font-size: 10px; color: #fff; background: #6a1f1f; border-radius: 6px; padding: 0 4px; text-shadow: none; }
body[data-mode="run"] .alerts { display: none; }
.card.paper { background: #f6c66a; border-color: #6a1f1f; box-shadow: 0 8px 0 #6a1f1f; }
.card.paper h2 { color: #fff4d8; -webkit-text-stroke: 1.5px #6a1f1f; text-shadow: 0 3px 0 #6a1f1f; }
.card.paper .person { background: #fbe2ae; border-color: #6a1f1f; }
.pframe { position: relative; width: 48px; height: 48px; flex: none; border: 3px solid #6a1f1f; border-radius: 8px; overflow: visible; background: #e8c47a; }
.pframe img { width: 100%; height: 100%; border-radius: 5px; display: block; }
.pframe .star { position: absolute; left: -10px; top: -10px; width: 22px; height: 22px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 12px; color: #2b1d2e; background: #fff4d8; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.ptype { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 8px; background: var(--c); color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #6a1f1f; }
.ptype svg { width: 24px; height: 20px; flex: none; }
.ptype span { display: grid; line-height: 1.1; text-align: left; }
.ptype small { font-size: 11px; font-weight: 600; opacity: 0.95; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font-family: var(--font-display); font-size: 13px; border: 3px solid #6a1f1f; border-radius: 9px; padding: 4px 8px 2px; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 4px; }
.tabs button.on { outline: 3px solid #fff4d8; }
.tabs svg { width: 20px; height: 17px; }
@media (max-width: 600px) {
  .alerts { top: 120px; }
  .alert { width: 38px; height: 38px; font-size: 22px; }
  .chip { font-size: 13px; padding: 2px 7px 2px 4px; }
  .ic { width: 16px; height: 16px; }
  .hbtn { font-size: 12px; padding: 5px 7px 3px; }
  .weapon .bar { width: 30px; }
  .chip.lvl .xp { width: 28px; }
  .hud.events { top: 74px; }
  .toasts { top: 110px; }
}

/* ---------- visual do jogo original: barras do topo e painéis laranja ---------- */
.hud.top { gap: 12px; align-items: center; }
.bar {
  pointer-events: auto; position: relative; display: flex; align-items: center; gap: 16px; height: 30px; padding: 0 18px 0 0;
  border: 3px solid #7a1c14; border-radius: 9px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), inset 0 -4px 0 rgba(0,0,0,0.12), 0 3px 0 #3a0c08;
  font-family: var(--font-display); font-size: 18px; color: #fff4dc; letter-spacing: 0.02em;
  text-shadow: 0 2px 0 #5a1a10, 1px 0 0 #5a1a10, -1px 0 0 #5a1a10, 0 -1px 0 #5a1a10;
}
.bar.orange { background: linear-gradient(#ffd56a, #f6a623 55%, #e2861a); }
.bar.teal { background: linear-gradient(#5ad8d0, #24a8a2 55%, #178580); }
.bar .stat { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-shadow: inherit; letter-spacing: inherit; font-variant-numeric: tabular-nums; }
.bar button.stat { cursor: pointer; }
.bar .ic { width: 30px; height: 30px; margin: -8px 0; filter: drop-shadow(0 2px 0 rgba(60,20,10,0.45)); }
.medal { position: relative; width: 48px; height: 48px; margin: -12px 0 -12px -12px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px; border: 3px solid #1f4a14; box-shadow: 0 3px 0 #10280a, inset 0 3px 0 rgba(255,255,255,0.4); }
.medal.green { background: radial-gradient(circle at 40% 35%, #a8ec7a, #4cae32 60%, #2f7a1e); }
.medal.blue { background: radial-gradient(circle at 40% 35%, #8ad0ff, #3a8ae0 60%, #1f5aa8); border-color: #10305a; box-shadow: 0 3px 0 #0a1c38, inset 0 3px 0 rgba(255,255,255,0.4); overflow: hidden; }
.medal svg { width: 100%; height: 100%; }

.medal .xp i { display: block; height: 100%; background: #ffd23f; }
.card {

    radial-gradient(circle at 12% 18%, rgba(255,242,170,0.55) 0 6%, transparent 7%),

    radial-gradient(circle at 72% 82%, rgba(226,110,26,0.22) 0 8%, transparent 9%),
    radial-gradient(circle at 24% 86%, rgba(255,236,160,0.45) 0 5%, transparent 6%),
    radial-gradient(circle at 48% 60%, rgba(255,236,160,0.3) 0 4%, transparent 5%),
    radial-gradient(ellipse at 50% 40%, #ffe07a 0%, #fbbf3c 45%, #f19a28 85%, #e07a1c 100%);

  color: #3a1408;
}
.card h1 { color: #fff8e4; -webkit-text-stroke: 2px #5a1a0a; text-shadow: 0 5px 0 #5a1a0a; }
.card h2 { font-size: 28px; text-align: center; color: #3a1408; padding: 0 44px; }
.card h3 { color: #8a3010; }
.card p, .card ul { color: #3a1408; }
.lvl, .card .lvl { color: #8a4a20; }
.note { color: #7a3a14 !important; }
.opt { background: rgba(255,246,214,0.72); border: 3px solid #8a3a18; }

}

.btn.green { background: linear-gradient(#a0e870, #5cbf3a 55%, #3e9a26); text-shadow: 0 2px 0 #1f5a12, 1px 0 0 #1f5a12, -1px 0 0 #1f5a12, 0 -1px 0 #1f5a12; }

.pickType { display: grid; grid-template-columns: 1fr minmax(120px, 240px); gap: 18px; align-items: center; }
.pickType .col { display: grid; gap: 16px; padding: 14px 10px; background: linear-gradient(transparent 0 8%, rgba(255,214,120,0.55) 8% 92%, transparent 92%); }
.bigbtn {
  font-family: var(--font-display); font-size: clamp(22px, 4vw, 32px); color: #fff; padding: 22px 10px 16px; border: 5px solid #6a1f14; border-radius: 12px; cursor: pointer; letter-spacing: 0.03em;
  background: linear-gradient(#7af0ea, #22c4be 50%, #149a96); box-shadow: inset 0 4px 0 rgba(255,255,255,0.5), 0 4px 0 #3a0c06;
  text-shadow: 0 3px 0 #0f4a48, 2px 0 0 #0f4a48, -2px 0 0 #0f4a48, 0 -1px 0 #0f4a48;
}
.bigbtn:active { transform: translateY(2px); }
.bigbtn:focus-visible, .pill:focus-visible { outline: 3px solid #3f8ae0; outline-offset: 3px; }
.pickType img { width: 100%; height: auto; display: block; }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.offer { display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; }
.offer img { width: 100%; aspect-ratio: 240 / 190; border-radius: 6px; display: block; }
.pill { font-family: var(--font-display); font-size: clamp(12px, 2.2vw, 16px); color: #fff; border: 0; border-radius: 8px; padding: 9px 6px 7px; cursor: pointer; letter-spacing: 0.04em; text-shadow: 0 2px 0 rgba(0,0,0,0.3); box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 3px 0 rgba(60,20,10,0.5); }
.pill.home { background: linear-gradient(#dc8040, #b85a2a); }
.pill.biz { background: linear-gradient(#5aa8f0, #2f7ad0); }
.pill.deco { background: linear-gradient(#7ad07a, #3a9a4a); }
.pill:disabled { background: #b8a888; cursor: default; box-shadow: none; }
.offer .price { display: inline-flex; gap: 4px; justify-content: center; align-items: center; font-weight: 700; color: #3a1408; font-size: 14px; }
.offer .price .ic { width: 18px; height: 18px; }
.offer small { font-size: 12.5px; color: #6a3418; line-height: 1.25; }
.newc { display: grid; gap: 10px; }
.wimg { width: 100%; max-width: 200px; height: auto; margin: -4px auto -6px; display: block; }
.newc .person .btn { margin-left: 4px; }
@media (max-width: 600px) {
  .bar { font-size: 13px; gap: 8px; height: 24px; padding-right: 9px; border-width: 2px; }
  .bar .ic { width: 22px; height: 22px; margin: -6px 0; }
  .medal { width: 36px; height: 36px; margin: -9px 0 -9px -9px; font-size: 15px; }
  .hud.top { gap: 8px 6px; }
  .offers { grid-template-columns: 1fr 1fr; }
  .pickType { grid-template-columns: 1fr; }
  .pickType img { max-width: 150px; margin: 0 auto; }
  .card.has-banner { margin-top: auto; padding-top: 20px; }
  .banner { position: static; transform: none; white-space: normal; text-align: center; font-size: 26px; line-height: 1.05; }
  .card h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .hbtn.warn, .toast { animation: none; } }
.bkIn { width: 100%; box-sizing: border-box; font: 13px/1.3 monospace; border: 3px solid #8a3a18; border-radius: 10px; padding: 8px; background: #fff8e8; color: #3a1408; resize: vertical; -webkit-user-select: text; user-select: text; }

/* ---------- botões numa faixa própria embaixo da rua, para não cobrir os zumbis ---------- */
.game { display: flex; flex-direction: column; }
.game canvas { flex: 1 1 0; min-height: 0; height: auto; }
.hud.bottom {
  position: relative; left: auto; right: auto; bottom: auto; flex: none;
  flex-wrap: nowrap; justify-content: flex-start; gap: 6px;
  padding: 7px 8px 6px; overflow-x: auto; scrollbar-width: none; pointer-events: auto;
  background: linear-gradient(#4a3f5c, #2b2238); border-top: 3px solid #6a1f1f;
}
.hud.bottom::-webkit-scrollbar { display: none; }
.hud.bottom .grp { flex-wrap: nowrap; flex: none; }
.hud.bottom .grp.town-only:not(:first-child), .hud.bottom .grp.run-only { margin-left: auto; }
.hud.bottom .hbtn { white-space: nowrap; }
/* alertas "!" no céu, à direita, longe de onde os zumbis chegam */
.alerts { left: auto; right: 22px; top: 104px; flex-direction: row; gap: 26px; }
@media (max-height: 500px) {
  .hbtn { font-size: 13px; padding: 5px 8px 3px; }
  .alert { width: 38px; height: 38px; font-size: 22px; }
}

  function tickBiz(dt, offline) {
    S.lots.forEach((L, i) => {
      if (!L || i >= S.lotsOpen || L.build > 0) return;
      const d = BLD[L.type];
      if (d.school) {
        if (!L.trainee) return;
        const p = S.people.find(x => x.id === L.trainee);
        if (!p || p.work !== i) { L.trainee = null; return; }
        L.trainT -= dt;
        if (L.trainT <= 0) {
          p.lvl = Math.min(10, (p.lvl || 1) + 1); p.work = null; L.trainee = null; L.trainT = 0;
          toast(`${p.name} terminou o treino e chegou ao nível ${p.lvl}!`, 'good');
          gainXP(4 + p.lvl * 2); logEvent(`${p.name} treinou até o nível ${p.lvl}`);
          if (!offline) sfx.dawn();
        }
        return;
      }
      if (d.home || d.deco || d.train || d.radio || d.bankB) return;
      const ws = workersOf(i);
      if (d.goods) {
        if (!ws.length) return;
        L.t += dt;
        const n = Math.floor(L.t / d.time);
        if (n > 0) { L.t -= n * d.time; S.goods = Math.min(GOODS_MAX, S.goods + n * Math.round(effK(L, ws))); }
        return;
      }
      if (d.repair) {
        if (ws.length) S.gateHp = Math.min(gateMax(), S.gateHp + d.repair * effK(L, ws) * dt);
        return;
      }
      let rem = dt;
      if (L.state === 'stock') {
        const f = workFactor(ws);
        if (!f) return;
        L.t -= rem * f;
        if (L.t > 0) return;
        rem = -L.t / f;
        L.state = 'sell'; L.t = TIER[L.prod].sell; L.left = L.pending;
        track('stock'); gainXP(TIER[L.prod].xp);
        ws.forEach(p => { if (Math.random() < 0.25 && (p.lvl || 1) < 3) p.lvl = (p.lvl || 1) + 1; });
      }
      if (L.state === 'sell') {
        const sp = S.fair > 0 && !offline ? 2 : 1;
        const use = Math.min(rem * sp, L.t);
        const earn = L.t > 0 ? L.left * use / L.t : L.left;
        L.bank += earn; L.left -= earn; L.t -= use;
        if (L.t <= 0.0001) { L.bank += L.left; L.left = 0; L.state = 'idle'; }
      }
    });
  }

  let AC = null, master = null, noiseBuf = null, muted = false;
  function initAudio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);

  function tone(f1, f2, dur, type = 'square', vol = 0.1, delay = 0) {

  sheet.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) { if (e.target === sheet && started && sheetKind !== 'runResult' && performance.now() - sheetAt > 450) closeSheet(); return; }
    initAudio();
    const act = b.dataset.act;
    switch (act) {
      case 'close': closeSheet(); return;
      case 'continue': begin(); return;
      case 'new': {
        if (hasSave() && !confirmNew) { confirmNew = true; renderSheet(); return; }
        incoming = []; freshGame(); zombies = []; walkers.clear();
        started = true; persist(); started = false;
        begin(true);
        return;
      }
      case 'buyLot': {
        const c = lotPrice();
        if (S.coins < c) return;
        S.coins -= c; S.lotsOpen++;
        puff(lotX(sheetArg) + LOT_W / 2, GROUND - 20);
        sfx.build();
        break;
      }
      case 'build': {
        const d = BLD[b.dataset.type];
        if (S.level < d.lvl) return;
        if (d.premium) { if (S.tokens < d.premium) return; S.tokens -= d.premium; }
        else { if (S.coins < d.cost) return; S.coins -= d.cost; }
        if (S.offers) S.offers[kindOf(b.dataset.type)] = null;
        S.lots[sheetArg] = newLot(b.dataset.type);
        S.lots[sheetArg].build = d.premium ? 30 : Math.round(clamp(d.cost / 5, 20, 180));
        puff(lotX(sheetArg) + LOT_W / 2, GROUND - 40, 24);
        sfx.build(); gainXP(15); track('build');
        toast(`Obra começou: ${d.name}. Fica pronta em ${fmtWait(S.lots[sheetArg].build)}.`, 'good');
        break;
      }
      case 'upgradeB': {
        const L = S.lots[sheetArg], c = upCost(L);
        if (L.lvl >= 3 || S.coins < c) return;
        S.coins -= c; L.lvl++;
        puff(lotX(sheetArg) + LOT_W / 2, GROUND - 80, 18);
        sfx.build(); gainXP(10); track('upgrade');
        break;
      }
      case 'order': {
        const L = S.lots[sheetArg], k = +b.dataset.k, ws = workersOf(sheetArg);
        if (L.state !== 'idle' || !ws.length || S.goods < TIER[k].goods) return;
        S.goods -= TIER[k].goods;
        L.state = 'stock'; L.prod = k; L.t = TIER[k].stock; L.pending = prodCoins(L, ws, k);
        sfx.build();
        break;
      }
      case 'rush': {
        const L = S.lots[sheetArg];
        if (L.state !== 'stock' || S.tokens < L.prod + 1) return;
        S.tokens -= L.prod + 1; L.t = 0.0001;
        tickBiz(0.001);
        break;
      }
      case 'hire': {
        const p = S.people.find(x => x.id === +b.dataset.id);
        if (p && workersOf(sheetArg).length < 3) {
          p.work = sheetArg; sfx.arrive();
          if (p.cat === BLD[S.lots[sheetArg].type].cat) { track('dream'); toast(`${p.name} conseguiu o emprego dos sonhos!`, 'good'); }
        }
        break;
      }
      case 'fire': {
        const p = S.people.find(x => x.id === +b.dataset.id);
        if (p) p.work = null;
        break;
      }
      case 'collect': collect(sheetArg); break;
      case 'pickKind': buildKind = b.dataset.k || null; renderSheet(true); return;
      case 'rerollB': {
        const c = rerollCost();
        if (!buildKind || S.coins < c) return;
        S.coins -= c; S.offers[buildKind] = rollOffers(buildKind); sfx.build();
        break;
      }
      case 'train': {
        const L = S.lots[sheetArg], p = S.people.find(x => x.id === +b.dataset.id);
        if (!L || !p || L.trainee) return;
        const lv = p.lvl || 1, c = trainCost(lv);
        if (lv >= 10 || S.coins < c) return;
        S.coins -= c; p.work = sheetArg; L.trainee = p.id; L.trainT = L.trainMax = trainTime(lv, L);
        sfx.build(); toast(`${p.name} começou a treinar. Fica pronto em ${fmtWait(L.trainT)}.`, 'good');
        break;
      }
      case 'rushTrain': {
        const L = S.lots[sheetArg], tk = Math.max(1, Math.ceil(L.trainT / 300));
        if (!L.trainee || S.tokens < tk) return;
        S.tokens -= tk; L.trainT = 0.01; tickBiz(0.02);
        break;
      }
      case 'stopTrain': {
        const L = S.lots[sheetArg], p = S.people.find(x => x.id === L.trainee);
        if (p) p.work = null;
        L.trainee = null; L.trainT = 0;
        break;
      }
      case 'accept': case 'decline': {
        const p = incoming.find(x => x.uid === +b.dataset.uid);
        if (!p) break;
        if (act === 'accept') {
          p.decided = true; sfx.arrive();
          if (S.people.length >= capacity()) toast(`${p.name} foi aceito(a), mas não há casa livre. Vai esperar lá fora.`, 'bad');
        } else {
          p.leaving = true; p.waiting = false;
          toast(`${p.name} foi embora pela estrada.`);
          logEvent(`${p.name} não foi aceito(a) na cidade`);
        }
        break;
      }
      case 'expel': {
        const id = +b.dataset.id;
        if (expelAsk !== id) { expelAsk = id; break; }

  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function packSave() {
    const json = JSON.stringify(S);
    if (window.CompressionStream) {
      const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return 'CB1:' + b64(new Uint8Array(buf));
    }
    return 'CB0:' + b64(new TextEncoder().encode(json));
  }
  async function unpackSave(code) {
    const m = /^CB([01]):([A-Za-z0-9+/=]+)$/.exec(String(code).replace(/\s+/g, ''));
    if (!m) throw new Error('Esse texto não é um código de backup da Cidade Barricada.');
    const bytes = unb64(m[2]);
    const json = m[1] === '1'
      ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      : new TextDecoder().decode(bytes);
    const d = JSON.parse(json);
    if (!d || d.v !== 2 || !Array.isArray(d.lots) || !Array.isArray(d.people)) throw new Error('O código está incompleto ou danificado.');
    return d;
  }

      return { ib: G - 90 };
    },
    fonte(o) {
      const { x, cx, L, nf, t, D, i } = o, G = GROUND;
      ell(cx, G - 6, 52 + L.lvl * 4, 10); ink(D('#b8b8c0'), 2); ell(cx, G - 9, 46 + L.lvl * 4, 7); ctx.fillStyle = D('#7ac8f0'); ctx.fill();
      rr(cx - 50 - L.lvl * 4, G - 12, 100 + L.lvl * 8, 10, 4); ink(D('#c8c8d0'), 1.8);
      rr(cx - 5, G - 50, 10, 40, 2); ink(D('#d8d8e0'), 1.6); ell(cx, G - 50, 20, 5); ink(D('#c8c8d0'), 1.6);
      if (L.lvl >= 2) { rr(cx - 3, G - 76, 6, 26, 2); ink(D('#d8d8e0'), 1.4); ell(cx, G - 76, 11, 3.5); ink(D('#c8c8d0'), 1.4); }
      const topY = L.lvl >= 2 ? G - 80 : G - 54;
      ctx.strokeStyle = 'rgba(160,215,245,0.85)'; ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) { const s = (k % 2 ? 1 : -1) * (12 + k * 4), ph = (t * 1.2 + k * 0.17) % 1; ctx.beginPath(); ctx.moveTo(cx, topY); ctx.quadraticCurveTo(cx + s * 0.5, topY - 22, cx + s, G - 12); ctx.stroke(); ctx.fillStyle = '#e8f6ff'; circle(cx + s * ph, topY - 22 * Math.sin(ph * Math.PI) + (G - 12 - topY) * ph * ph, 1.8); ctx.fill(); }
      for (const [px, f] of [[x + 14, 1], [x + 116, -1]]) { const hop = Math.abs(Math.sin(t * 3 + px)) * 2; ell(px, G - 4 - hop, 6, 4); ink(D('#9aa0b0'), 1.2); circle(px + 5 * f, G - 8 - hop, 3); ink(D('#9aa0b0'), 1.1); ctx.fillStyle = '#f08a3c'; ctx.fillRect(px + 7 * f - (f < 0 ? 2 : 0), G - 8 - hop, 2, 1.5); }
      lampPost(x + 2, nf, t); lampPost(x + 128, nf, t);
      return { ib: topY - 30 };
    },
    mural(o) {
      const { x, cx, L, nf, t, D, i } = o, G = GROUND, h = 70 + (L.lvl - 1) * 14, wy = G - h;
      wallMaterial({ mat: 'brick', wall: '#e8d8c0' }, x + 6, wy, 118, h, nf, srand(i * 3 + 9));
      ctx.save(); rr(x + 10, wy + 6, 110, h - 12, 3); ctx.clip();
      const rng = srand(i * 11 + 4), pal = ['#e04fa0', '#3f8ae0', '#f6d05b', '#5bbf7a', '#f08a3c', '#a050e0'];
      for (let k = 0; k < 9; k++) { ctx.fillStyle = D(pal[k % pal.length]); circle(x + 10 + rng() * 110, wy + 6 + rng() * (h - 12), 10 + rng() * 22); ctx.fill(); }
      ctx.restore();
      ctx.save(); ctx.translate(cx, wy + h / 2); ctx.rotate(-0.08);
      ctx.beginPath(); ctx.moveTo(0, 8); ctx.bezierCurveTo(-26, -10, -14, -26, 0, -12); ctx.bezierCurveTo(14, -26, 26, -10, 0, 8); ink(D('#e0302a'), 1.6);
      text('BARRICADA', 0, 18, 11, D('#ffffff'), 'center', INK, 'Luckiest Guy', 400);
      ctx.restore();
      rr(x + 4, wy - 4, 122, 6, 2); ink(D('#b8a890'), 1.4);
      for (const [px, c] of [[x + 14, '#e04fa0'], [x + 24, '#3f8ae0']]) { rr(px - 4, G - 10, 8, 10, 1); ink(D(c), 1.2); }
      if (L.lvl >= 2) { ctx.strokeStyle = D('#c8a060'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 104, G); ctx.lineTo(x + 112, wy + 10); ctx.moveTo(x + 116, G); ctx.lineTo(x + 122, wy + 10); for (let yy = G - 8; yy > wy + 14; yy -= 9) { const u = (G - yy) / (G - wy - 10); ctx.moveTo(x + 104 + 8 * u, yy); ctx.lineTo(x + 116 + 6 * u, yy); } ctx.stroke(); }
      const p = idlers(i, 1)[0]; if (p) drawPerson(x + 92, G, 0.66, p, 0, -1, false, { idle: t + p.id, gun: false });
      return { ib: wy - 6 };
    },
    parquinho(o) {
      const { x, cx, L, nf, t, D, i } = o, G = GROUND;
      ell(x + 100, G - 3, 26, 5); ctx.fillStyle = D('#e8d090'); ctx.fill();
      ctx.strokeStyle = D('#3f8ae0'); ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x + 6, G); ctx.lineTo(x + 20, G - 74); ctx.lineTo(x + 34, G); ctx.moveTo(x + 46, G); ctx.lineTo(x + 60, G - 74); ctx.lineTo(x + 74, G); ctx.moveTo(x + 18, G - 72); ctx.lineTo(x + 62, G - 72); ctx.stroke();
      for (const [sx, ph] of [[x + 32, 0], [x + 50, 1.6]]) { const a = Math.sin(t * 2.2 + ph) * 0.45; ctx.save(); ctx.translate(sx, G - 72); ctx.rotate(a); ctx.strokeStyle = D('#5a5a66'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-5, 52); ctx.moveTo(5, 0); ctx.lineTo(5, 52); ctx.stroke(); rr(-8, 50, 16, 4, 1); ink(D('#e04f4f'), 1.2); ctx.restore(); }
      const kids = idlers(i, 2); kids.forEach((p, k) => { const a = Math.sin(t * 2.2 + k * 1.6) * 0.45, sx = x + 32 + k * 18; drawPerson(sx + Math.sin(a) * 52, G - 72 + Math.cos(a) * 52, 0.5, p, 0, 1, false, {}); });
      ctx.beginPath(); ctx.moveTo(x + 84, G - 50); ctx.lineTo(x + 124, G - 4); ctx.lineTo(x + 130, G - 4); ctx.lineTo(x + 92, G - 52); ctx.closePath(); ink(D('#f6d05b'), 1.6);
      ctx.strokeStyle = D('#3a3a44'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 84, G); ctx.lineTo(x + 84, G - 52); ctx.moveTo(x + 94, G); ctx.lineTo(x + 94, G - 52); for (let yy = G - 8; yy > G - 50; yy -= 9) { ctx.moveTo(x + 84, yy); ctx.lineTo(x + 94, yy); } ctx.stroke();
      rr(x + 80, G - 56, 18, 5, 1); ink(D('#e04f4f'), 1.2);
      if (L.lvl >= 2) { ctx.strokeStyle = D('#5bbf7a'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 100, G - 4); ctx.lineTo(x + 112, G - 4); ctx.stroke(); rr(x + 96, G - 12, 8, 8, 1); ink(D('#e04f4f'), 1); }
      lampPost(x + 128, nf, t, 58);
      return { ib: G - 100 };
    },
    coreto(o) {
      const { x, cx, L, nf, t, D, i } = o, G = GROUND;
      shadow(cx, G + 2, 60, 6);
      rr(x + 10, G - 16, 110, 16, 3); ink(D('#d8d0c0'), 1.8);
      for (let k = 0; k < 5; k++) { const px = x + 16 + k * 24.5; rr(px - 2.5, G - 74, 5, 58, 1); ink(D('#f4f0e4'), 1.4); }
      ctx.strokeStyle = D('#f4f0e4'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 14, G - 30); ctx.lineTo(x + 116, G - 30); for (let k = x + 18; k < x + 116; k += 6) { ctx.moveTo(k, G - 30); ctx.lineTo(k, G - 17); } ctx.stroke();
      const band = idlers(i, 3);
      band.forEach((p, k) => drawPerson(x + 38 + k * 26, G - 17, 0.62, p, 0, k === 2 ? -1 : 1, false, { idle: t * 2 + k, gun: false }));
      ctx.beginPath(); ctx.moveTo(x + 2, G - 72); ctx.quadraticCurveTo(cx, G - 112 - L.lvl * 4, x + 128, G - 72); ctx.closePath(); ink(D('#2f8a5a'), 2);
      ctx.beginPath(); for (let k = 0; k < 9; k++) { ctx.moveTo(x + 4 + k * 15.5, G - 72); ctx.arc(x + 11.75 + k * 15.5, G - 72, 7.75, Math.PI, 0, true); } ctx.fillStyle = D('#f4f0e4'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, G - 108 - L.lvl * 4); ctx.lineTo(cx, G - 124 - L.lvl * 4); ctx.stroke(); circle(cx, G - 126 - L.lvl * 4, 3.5); ink('#ffd23f', 1.2);
      if (band.length) { const ph = (t * 0.7) % 1; ctx.globalAlpha = 1 - ph; text(ph < 0.5 ? '♪' : '♫', cx + 18 + ph * 14, G - 60 - ph * 30, 13, '#ffffff', 'center', INK); ctx.globalAlpha = 1; }
      if (nf > 0.1) for (let k = 0; k < 9; k++) { ctx.fillStyle = (k + Math.floor(t * 2)) % 2 ? '#ffe680' : '#ffb547'; circle(x + 10 + k * 14, G - 70, 1.8); ctx.fill(); }
      return { ib: G - 130 - L.lvl * 4 };
    },
    estatua(o) {
      const { x, cx, L, nf, t, D } = o, G = GROUND;
      flowerBed(x + 8, 34, D); flowerBed(x + 88, 34, D);
      rr(cx - 24, G - 40, 48, 40, 3); ink(D('#c8c0b0'), 2); rr(cx - 30, G - 46, 60, 8, 2); ink(D('#d8d0c0'), 1.6); rr(cx - 30, G - 8, 60, 8, 2); ink(D('#b8b0a0'), 1.6);
      rr(cx - 16, G - 30, 32, 12, 2); ink(D('#c8a050'), 1.2); text('HERÓIS', cx, G - 23.5, 6.5, D('#5a3a10'), 'center', null, 'Luckiest Guy', 400);
      ctx.save(); ctx.globalAlpha = 1; drawPerson(cx, G - 46, 1.25 + 0.15 * (L.lvl - 1), { name: 'Estátua', skin: '#b8bcc0', shirt: '#a0a6ac', hair: '#8a9096', look: { style: 'helmet', pants: '#9aa0a6' } }, 0, 1, false, { gun: 'rifle' }); ctx.restore();
      lampPost(x + 4, nf, t); lampPost(x + 126, nf, t);
      if (Math.sin(t * 1.5) > 0.96) { ctx.fillStyle = '#ffffff'; circle(cx + 6, G - 96, 2); ctx.fill(); }
      return { ib: G - 120 };
    },
  });

  // ---------- Laço ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    draw();
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.15; updateHUD(); }
    requestAnimationFrame(frame);
  }
  if (!loadGame()) freshGame();
  document.body.dataset.mode = 'town';
  resize();
  camX = gateView(); clampCam();
  openSheet('intro');
  if (document.fonts && document.fonts.load) { document.fonts.load('400 20px "Luckiest Guy"').catch(() => {}); document.fonts.load('700 16px "Fredoka"').catch(() => {}); }
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
